<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almira Clan Landing Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Full page container using base64 image */
	.landing-container {
		width: 100%;
		height: 100vh;
		background: url("LandingPage.PNG") no-repeat center center;
		background-size: contain; /* show full image */
		background-color: #0d5b66; /* fallback color behind empty areas */
		position: relative;
	}

    /* REAL BUTTON styled to match the circle */
		.info-button {
		position: absolute;
		right: 6.5%;
		bottom: 20%;
		padding: 18px 28px;
		font-size: 18px;
		font-weight: bold;
		background: #ff4cd8;
		color: white;
		border: none;
		border-radius: 50px;
		cursor: pointer;
		box-shadow: 0 0 10px rgba(0,0,0,0.3);
		transition: 0.2s ease-in-out;
	}

	/* Hover effect: color change + glow */
	.info-button:hover {
		background: #ff2dcf;
		box-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
	}

	/* Click (optional slight press effect) */
	.info-button:active {
		transform: scale(0.95);
		box-shadow: 0 0 22px rgba(255, 255, 255, 1);
	}

    /* Mobile adjustments */
    @media (max-width: 768px) {
        .info-button {
            right: 50%;
            transform: translateX(50%);
            bottom: 10%;
        }
    }
</style>
</head>
<body>

<div class="landing-container">

    <!-- REAL HTML BUTTON -->
    <button class="info-button" onclick="window.location.href='info-sheet.html'">
        Clan Member Info Sheet
    </button>

</div>

</body>
</html>
