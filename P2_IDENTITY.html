<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Full page container using image */
    .landing-container {
        width: 100%;
        height: 100vh;
        background: url("P2_IDENTITY.PNG") no-repeat center center;
        background-size: contain;
        background-color: #0d5b66; /* fallback color */
        position: relative;
    }

    /* Transparent clickable button with hover glow */
	.info-buttonP2 {
		position: absolute;
		right: 50.5%;           /* adjust horizontal position */
		bottom: 5%;          /* adjust vertical position */
		width: 130px;         /* rectangle width */
		height: 50px;         /* rectangle height */
		background: transparent;  /* yellow button */
		border: none;
		border-radius: 0;     /* rectangle shape */
		cursor: pointer;
		transition: 0.3s ease-in-out;
	}

	/* Hover glow */
	.info-buttonP2:hover {
		box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.8); /* yellow glow */
		transform: scale(1.05); /* slight grow effect */
	}

	/* Click effect */
	.info-buttonP2:active {
		transform: scale(0.95);
		box-shadow: 0 0 25px 8px rgba(255, 76, 216, 1);
	}
