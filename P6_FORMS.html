	.back-button {
    position: absolute;
    right: 70.5%; 
    bottom: 88.5%;
    width: 80px;
    height: 80px;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

/* Arrow line */
	.back-button::before {
		content: "";
		position: absolute;
		top: 50%;
		left: 45%;
		width: 45px;
		height: 6px;
		background: #ff4cd8; /* pink */
		transform: translate(-50%, -50%);
		transition: 0.3s ease-in-out;
		border-radius: 3px;
	}

	/* Triangle(arrow head) */
	.back-button::after {
		content: "";
		position: absolute;
		top: 50%;
		left: 20%;
		width: 0;
		height: 0;
		border-top: 10px solid transparent;
		border-bottom: 10px solid transparent;
		border-right: 15px solid #ff4cd8; /* triangle */
		transform: translate(-50%, -50%);
		transition: 0.3s ease-in-out;
	}

	/* Hover glow */
	.back-button:hover::before,
	.back-button:hover::after {
		box-shadow: 0 0 12px 4px rgba(255, 76, 216, 0.8);
		transform: translate(-50%, -50%) scale(1.1);
	}

	/* Click effect */
	.back-button:active::before,
	.back-button:active::after {
		transform: translate(-50%, -50%) scale(0.9);
		box-shadow: 0 0 20px 8px rgba(255, 76, 216, 1);
	}
    /* Mobile adjustments */
    @media (max-width: 768px) {
