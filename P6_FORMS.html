<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almira Clan Landing Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Full page container using image */
    .landing-container {
        width: 100%;
        height: 100vh;
        background: url("P6_FORMS.PNG") no-repeat center center;
        background-size: contain;
        background-color: #0d5b66; /* fallback color */
        position: relative;
    }

    /* Transparent clickable button with hover glow */
    .info-button {
        position: absolute;
        right: 23%; /* adjust horizontal position */
        bottom: 42%; /* adjust vertical position */
        width: 90px;  /* size of clickable area */
        height: 90px;
        background: transparent; /* fully invisible */
        border: none;
        border-radius: 50%; /* circular clickable area */
        cursor: pointer;
        transition: 0.3s ease-in-out;
    }

    /* Hover glow */
    .info-button:hover {
        box-shadow: 0 0 20px 5px rgba(255, 76, 216, 0.7); /* pink glow */
        transform: scale(1.05); /* optional slight grow effect */
    }

    /* Click effect */
    .info-button:active {
        transform: scale(0.95);
        box-shadow: 0 0 25px 8px rgba(255, 76, 216, 1);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        .info-button {
            right: 50%;
            transform: translateX(50%);
            bottom: 10%;
        }
    }
</style>
</head>
<body>

<div class="landing-container">
    <!-- Transparent clickable button with glow on hover -->
    <button class="info-button" onclick="window.location.href='P6_FORMS.html';" title="Click!"></button>
</div>

</body>
</html>
