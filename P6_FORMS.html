<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almira Clan Landing Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Full page container using image */
    .landing-container {
        width: 100%;
        height: 100vh;
        background: url("P6_FORMS.PNG") no-repeat center center;
        background-size: contain;
        background-color: #0d5b66; /* fallback color */
        position: relative;
    }

    /* Common styles for all buttons */
    .landing-container button {
        position: absolute;
        background: #FFD700;       /* yellow default */
        border: none;
        border-radius: 0;          /* rectangle shape */
        cursor: pointer;
        transition: 0.3s ease-in-out;
        pointer-events: auto;      /* ensure clicks work */
        touch-action: manipulation; /* mobile tap support */
        -webkit-tap-highlight-color: rgba(0,0,0,0);
    }

    /* Hover glow (desktop) */
    .landing-container button:hover {
        box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.8); /* yellow glow */
        transform: scale(1.05);
    }

    /* Click effect */
    .landing-container button:active {
        transform: scale(0.95);
        box-shadow: 0 0 25px 8px rgba(255, 215, 0, 1);
    }

    /* Individual button positions and sizes */
    .info-buttonP2 { right: 50.5%; bottom: 5%; width: 130px; height: 50px; }
    .info-buttonP3 { right: 41%;   bottom: 5%; width: 122px; height: 50px; }
    .info-buttonP4 { right: 33.5%; bottom: 5%; width: 90px;  height: 50px; }
    .info-buttonP5 { right: 26.5%; bottom: 5%; width: 85px;  height: 50px; }
    .info-buttonP6 { right: 20%;   bottom: 5%; width: 75px;  height: 50px; }
    .info-button   { right: 23%;   bottom: 42%; width: 90px;  height: 90px; border-radius: 50%; background: #FFD700; }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        .landing-container button {
            /* Slightly larger tap areas for mobile */
            min-width: 48px;
            min-height: 48px;
        }

        /* Optional: reposition for small screens if needed */
        .info-button { right: 50%; transform: translateX(50%); bottom: 10%; }
        .info-buttonP2 { right: 55%; bottom: 10%; }
        .info-buttonP3 { right: 45%; bottom: 10%; }
        .info-buttonP4 { right: 37%; bottom: 10%; }
        .info-buttonP5 { right: 29%; bottom: 10%; }
        .info-buttonP6 { right: 22%; bottom: 10%; }
    }
</style>
</head>
<body>

<div class="landing-container">
    <button class="info-button"  onclick="window.location.href='P6_FORMS.html';"    title="Click!"></button>
    <button class="info-buttonP2" onclick="window.location.href='P2_IDENTITY.html';" title="Click!"></button>
    <button class="info-buttonP3" onclick="window.location.href='P3_NEWS.html';"     title="Click!"></button>
    <button class="info-buttonP4" onclick="window.location.href='P4_FAQs.html';"     title="Click!"></button>
    <button class="info-buttonP5" onclick="window.location.href='P5_FEEDBACK.html';" title="Click!"></button>
    <button class="info-buttonP6" onclick="window.location.href='P6_FORMS.html';"    title="Click!"></button>
</div>

</body>
</html>
